[project]
name = "streamlit-pyvista"
version = "0.1.0"
description = "Fast PyVista viewer for Streamlit (binary glTF + three.js), drop-in for stpyvista"
readme = "README.md"
license = "MIT"
authors = [{ name = "Robert Marik" }]
requires-python = ">=3.12"
dependencies = [
    "pyvista>=0.49.2",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/st_pv"]
